<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Schedule | UMKL</title>
    <meta name="description" content="View the schedule for upcoming matches in the UMKL">
    <link rel="icon" href="/assets/media/brand/favicon.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/base/style.css">
    <link rel="stylesheet" href="/assets/css/base/settings.css">
    <link rel="stylesheet" href="/assets/css/pages/calendar.css">
    <link rel="stylesheet" href="/assets/css/components/eventbox.css">
    <link rel="stylesheet" href="/assets/css/components/copypopup.css">
    <link rel="stylesheet" href="/assets/css/ext/fontawesome.min.css">

    <meta property="og:title" content="UMKL | Schedule" />
    <meta property="og:site_name" content="umkl.co.uk" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umkl.co.uk/schedule/" />
    <meta property="og:image" content="https://umkl.co.uk/assets/media/brand/cheep_cheep_banner_crop.avif" />
    <meta property="og:description" content="View the schedule for upcoming matches in the UMKL" />
    <meta content="#bc0839" name="theme-color" />

    <!-- Include this to make the og:image larger -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Components -->
    <link rel="modulepreload" href="/assets/components/navbar.js">
    <link rel="modulepreload" href="/assets/components/footer.js">
    <script type="module" src="/assets/components/navbar.js" defer></script>
    <script type="module" src="/assets/components/footer.js" defer></script>

    <!-- Scripts -->
    <script src="/assets/scripts/base/theme.js"></script>

    <script type="module" src="/assets/scripts/base/settings.js" defer></script>
    <script defer src="/assets/scripts/base/imagefade.js" type="module"></script>
    <script type="module" src="/assets/scripts/pages/matchcalendar.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.min.js" defer></script>
</head>

<body id="top">
    <umkl-navbar></umkl-navbar>

    <main>
        <noscript>
            <blockquote class="rainbow"><b>Javascript disabled!</b><br>Please enable javascript, as is it used on this
                page<br></blockquote>
        </noscript>

        <div class="header-wrapper">
            <h1>Schedule</h1>
            <p class="p-below-title">
                View the schedule for upcoming matches.
                Please take a look at the <a href="/rules/match">match rules</a> before playing.<br>
            </p>
            <div>
                <button style="margin-top: 5px;" id="listViewButton"><span class="fa-solid fa-bars"></span> Show Match
                    List</button>
                <button style="margin-top: 5px;" onclick="location.href='/schedule/stats'"><span
                        class="fa-solid fa-trophy"></span> View Match Stats</button>
                <button style="margin-top: 5px;" onclick="location.href='webcal://api.umkl.co.uk/matches.ics'"><span
                        class="fa-solid fa-calendar"></span> Import Calendar (.ics)</button>
            </div>
        </div>

        <div id="calendarError"></div>

        <blockquote class="hidden warning" id="overseasMessage"></blockquote>

        <div id="calendarListView" class="hidden"></div>

        <div class="calendar-container" id="calendar-container">
            <div class="calendar">
                <div class="calendar-header">
                    <div class="month" id="monthYear">
                        <a class="month-arrow" id="previousMonthButton"></a>
                        <span class="month-name" id="goToCurrentMonthButton">Loading...</span>
                        <a class="month-arrow" id="nextMonthButton"></a>
                    </div>
                </div>
                <div class="calendar-body" id="calendarDays"></div>
            </div>

            <div id="expandedLog"></div>
    </main>

    <umkl-footer></umkl-footer>
</body>

</html>
