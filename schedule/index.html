<!DOCTYPE html>

    <link rel="stylesheet" href="/_assets/css/base/style.css">
    <link rel="stylesheet" href="/_assets/css/base/settings.css">
    <link rel="stylesheet" href="/_assets/css/components/searchbox.css">
    <link rel="stylesheet" href="/_assets/css/pages/calendar.css">
    <link rel="stylesheet" href="/_assets/css/components/eventbox.css">
    <link rel="stylesheet" href="/_assets/css/components/teamstandings.css">

    <meta property="og:title" content="UMKL | Schedule" />
    <meta property="og:site_name" content="umkl.co.uk" />

        content="https://umkl.co.uk/_assets/media/brand/guidelines/logo_transparent_standard.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umkl.co.uk/schedule/" />
    <meta property="og:image" content="https://umkl.co.uk/_assets/media/brand/cheep_cheep_banner_crop.avif" />
    <meta property="og:description" content="View the schedule for upcoming matches in the UMKL" />

    <!-- Include this to make the og:image larger -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Components -->
    <link rel="modulepreload" href="/_assets/webcomponents/navbar.js">
    <link rel="modulepreload" href="/_assets/webcomponents/footer.js">
    <script type="module" src="/_assets/webcomponents/navbar.js" defer></script>
    <script type="module" src="/_assets/webcomponents/footer.js" defer></script>

    <!-- Scripts -->
    <script src="/_assets/scripts/base/theme.js"></script>

    <script type="module" src="/_assets/scripts/base/settings.js" defer></script>
    <script defer src="/_assets/scripts/base/imagefade.js" type="module"></script>
    <script type="module" src="/_assets/scripts/pages/matchcalendar.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.min.js" defer></script>
</head>

<body id="top">
    <umkl-navbar></umkl-navbar>

    <main>
        <noscript>
            <blockquote class="rainbow"><b>Javascript disabled!</b><br>Please enable javascript, as it is used on this
                page<br></blockquote>
        </noscript>

        <h1>Schedule</h1>
        <p class="p-below-title">
            View the schedule for upcoming matches, and see the results for past matches.
        </p>

        <div class="bubble-link-wrapper">
            <nav class="bubble-nav">
                <a class="bubble-nav-item no-color-link active" href="/schedule/">Schedule</a>
                <a class="bubble-nav-item no-color-link" href="/schedule/stats/">Match Stats</a>
            </nav>
            <a class="bubble-link no-color-link" href="webcal://api.umkl.co.uk/matches.ics">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" role="presentation"><path fill="currentColor" d="M6 1.5V3V1.5V3H3.75Q2.81 3.05 2.16 3.66Q1.55 4.31 1.5 5.25V7.5H22.5V5.25Q22.45 4.31 21.84 3.66Q21.19 3.05 20.25 3H18V1.5Q18 0.84 17.58 0.42Q17.16 0 16.5 0Q15.84 0 15.42 0.42Q15 0.84 15 1.5V3H9V1.5Q9 0.84 8.58 0.42Q8.16 0 7.5 0Q6.84 0 6.42 0.42Q6 0.84 6 1.5ZM22.5 9H1.5H22.5H1.5V21.75Q1.55 22.69 2.16 23.34Q2.81 23.95 3.75 24H20.25Q21.19 23.95 21.84 23.34Q22.45 22.69 22.5 21.75V9Z"></path></svg> Subscribe to calendar
            </a>
            <a class="bubble-link no-color-link" href="/rules/match/">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" role="presentation"><path fill="currentColor" d="M4.5 1.5Q4.5 0.84 4.08 0.42Q3.66 0 3 0Q2.34 0 1.92 0.42Q1.5 0.84 1.5 1.5V3V17.25V22.5Q1.5 23.16 1.92 23.58Q2.34 24 3 24Q3.66 24 4.08 23.58Q4.5 23.16 4.5 22.5V16.5L7.5 15.75Q10.5 15.05 13.27 16.36Q16.5 17.95 19.92 16.73L21.52 16.12Q22.45 15.7 22.5 14.72V3.09Q22.45 2.25 21.8 1.88Q21.19 1.45 20.39 1.78L19.97 2.02Q18.28 2.81 16.5 2.81Q14.72 2.81 13.08 2.02Q10.5 0.8 7.73 1.45L4.5 2.25V1.5Z"></path></svg> Match rules
            </a>
        </div>

        <div id="calendarError"></div>

        <div class="hidden" id="overseasMessage"></div>

        <div class="calendar-container" id="calendar-container">
            <div class="calendar-main">
                <section class="calendar" aria-label="Match calendar">
                    <div class="calendar-header">
                        <div class="month" id="monthYear">
                            <span class="month-name">Loading&hellip;</span>
                        </div>
                    </div>
                    <div class="calendar-body" id="calendarDays"></div>
                </section>

                <div id="expandedLog"></div>
            </div>

            <div class="calendar-sidebar">
                <div id="calendarListView">
                    <div class="list-view-header">
                        <h2>All Matches</h2>
                    </div>
                    <div class="list-view-search-row">
                        <div id="calendar-search-wrapper">
                            <input id="calendar-search" placeholder="Search matches..." type="text" />
                            <button type="button" id="calendar-search-clear" class="search-clear-inline"
                                aria-label="Clear search">&times;</button>
                        </div>
                    </div>
                    <div class="list-view-content" id="listViewContent"></div>
                </div>
            </div>
        </div>
    </main>

    <umkl-footer></umkl-footer>
</body>

</html>
