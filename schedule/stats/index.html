<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Match Stats | UMKL</title>
    <meta name="description" content="This page shows match stats in the UMKL">
    <link rel="icon" href="/assets/media/brand/favicon.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/base/style.css">
    <link rel="stylesheet" href="/assets/css/components/teampage.css">
    <link rel="stylesheet" href="/assets/css/components/matchstats.css">
    <link rel="stylesheet" href="/assets/css/base/settings.css">
    <link rel="stylesheet" href="/assets/css/ext/fontawesome.min.css">

    <meta property="og:title" content="UMKL | Match Stats" />
    <meta property="og:site_name" content="UMKL" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umkl.co.uk/schedule/stats/" />
    <meta property="og:image" content="https://umkl.co.uk/assets/media/brand/cheep_cheep_banner_crop.avif" />
    <meta property="og:description" content="This page shows match stats in the UMKL" />
    <meta content="#bc0839" name="theme-color" />

    <!-- Include this to make the og:image larger -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Components -->
    <link rel="modulepreload" href="/assets/components/navbar.js">
    <link rel="modulepreload" href="/assets/components/footer.js">
    <script type="module" src="/assets/components/navbar.js" defer></script>
    <script type="module" src="/assets/components/footer.js" defer></script>

    <!-- Scripts -->
    <script src="/assets/scripts/base/theme.js"></script>
    
    <script type="module" src="/assets/scripts/base/settings.js" defer></script>
    <script defer src="/assets/scripts/base/imagefade.js" type="module"></script>
    <script type="module" src="/assets/scripts/components/matchstatsgenerate.js" defer></script>
</head>
<body id="top">
    <umkl-navbar></umkl-navbar>

    <main>
        <a href="/matches/" id="backButton">Back</a>
        <h1>Match Stats</h1>
        <p class="p-below-title">View stats about past matches.
        <hr class="hr-below-title">

        <p>
            <b>Options</b><br>
            <label for="testMatches">Include test matches:</label>
            <input type="checkbox" id="testMatches" name="testMatches">
            <br>
            <label for="pointsDiff">Show the average points difference for a track:</label>
            <input type="checkbox" id="pointsDiff" name="pointsDiff">
            <br>
            <label for="teamFrequency">Show how often teams have played a track:</label>
            <input type="checkbox" id="teamFrequency" name="teamFrequency">
            <br>
            <label for="daysPlayed">Show the dates a track was played on:</label>
            <input type="checkbox" id="daysPlayed" name="daysPlayed">
        </p>

        <div id="JSTeamBox" class="team-info">
            Loading match information...
        </div>
    </main>

    <umkl-footer></umkl-footer>
</body>
</html>
