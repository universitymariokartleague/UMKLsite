<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="#bc0839" name="theme-color" />
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-title" content="UMKL">
    <title>Match Stats | UMKL</title>
    <meta name="description" content="This page shows match stats in the UMKL">
    <link rel="icon" href="/_assets/media/brand/favicon.jpg" type="image/png">
    <link rel="apple-touch-icon" href="/_assets/media/brand/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap">
    <link rel="stylesheet" href="/_assets/css/base/style.css">
    <link rel="stylesheet" href="/_assets/css/components/matchstats.css">
    <link rel="stylesheet" href="/_assets/css/components/toggle.css">
    <link rel="stylesheet" href="/_assets/css/components/searchbox.css">
    <link rel="stylesheet" href="/_assets/css/components/modal.css">
    <link rel="stylesheet" href="/_assets/css/base/settings.css">

    <meta property="og:title" content="UMKL | Match Stats" />
    <meta property="og:site_name" content="umkl.co.uk" />
    <meta property="og:logo"
        content="https://umkl.co.uk/_assets/media/brand/guidelines/logo_transparent_standard.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umkl.co.uk/schedule/stats/" />
    <meta property="og:image" content="https://umkl.co.uk/_assets/media/brand/cheep_cheep_banner_crop.avif" />
    <meta property="og:description" content="This page shows match stats in the UMKL" />

    <!-- Include this to make the og:image larger -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Components -->
    <link rel="modulepreload" href="/_assets/webcomponents/navbar.js">
    <link rel="modulepreload" href="/_assets/webcomponents/footer.js">
    <script type="module" src="/_assets/webcomponents/navbar.js" defer></script>
    <script type="module" src="/_assets/webcomponents/footer.js" defer></script>

    <!-- Scripts -->
    <script src="/_assets/scripts/base/theme.js"></script>

    <script type="module" src="/_assets/scripts/base/settings.js" defer></script>
    <script defer src="/_assets/scripts/base/imagefade.js" type="module"></script>
    <script type="module" src="/_assets/scripts/components/matchstatsgenerate.js" defer></script>
</head>

<body id="top">
    <umkl-navbar></umkl-navbar>

    <main>
        <noscript>
            <blockquote class="rainbow"><b>Javascript disabled!</b><br>Please enable javascript, as it is used on this
                page<br></blockquote>
        </noscript>

        <h1>Match Stats</h1>
        <p class="p-below-title">View stats about past matches.</p>

        <div class="bubble-link-wrapper">
            <nav class="bubble-nav">
                <a class="bubble-nav-item no-color-link" href="/schedule/">Schedule</a>
                <a class="bubble-nav-item no-color-link active" href="/schedule/stats/">Match Stats</a>
            </nav>
        </div>

        <div class="stats-controls">
            <div id="track-search-wrapper">
                <input type="text" id="track-search" placeholder="Search tracks..." autocomplete="off">
                <button type="button" id="track-search-clear" class="search-clear-inline"
                    aria-label="Clear search">&times;</button>
            </div>
            <select id="team-filter" class="bubble-link" aria-label="Only show stats for a team">
                <option value="">All teams</option>
            </select>
            <div id="track-sort" class="bubble-link-wrapper" role="group" aria-label="Sort tracks by">
                <button type="button" class="bubble-link bubble-link-accent" data-value="mostPlayed">Most
                    played</button>
                <button type="button" class="bubble-link no-color-link" data-value="leastPlayed">Least played</button>
                <button type="button" class="bubble-link no-color-link" data-value="alphabetical">A-Z</button>
            </div>
            <label class="toggle">
                <input type="checkbox" id="unplayedTracks">
                Show unplayed tracks
            </label>
            <label class="toggle">
                <input type="checkbox" id="testMatches">
                Show test matches
            </label>
        </div>

        <div id="JSTeamBox" class="team-info"></div>
        <div id="track-no-results" style="display:none;">
            <p>No tracks found</p>
            <button id="track-clear-search">Clear search</button>
        </div>

        <dialog id="trackModal" class="track-modal-dialog" aria-labelledby="trackModalTitle">
            <div class="settings-header track-modal-header">
                <img id="trackModalIcon" class="track-modal-icon" alt="" loading="lazy">
                <h2 id="trackModalTitle" class="track-modal-title"></h2>
                <button type="button" id="trackModalClose" class="settings-close-btn" aria-label="Close track details">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24"
                        role="img">
                        <title>Close track details</title>
                        <path fill="currentColor"
                            d="M13.48 12 19 17.52 17.52 19 12 13.48 6.48 19 5 17.52 10.52 12 5 6.48 6.48 5 12 10.52 17.52 5 19 6.48z">
                        </path>
                    </svg>
                </button>
            </div>

            <div class="track-modal-body" id="trackModalBody"></div>
        </dialog>
    </main>

    <umkl-footer></umkl-footer>
</body>

</html>
