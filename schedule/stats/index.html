<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Match Stats | UMKL</title>
    <meta name="description" content="This page shows match stats in the UMKL">
    <link rel="icon" href="/assets/media/brand/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/assets/media/brand/favicon.png">
    <link rel="stylesheet" href="/assets/css/base/style.css">
    <link rel="stylesheet" href="/assets/css/components/teampage.css">
    <link rel="stylesheet" href="/assets/css/components/matchstats.css">
    <link rel="stylesheet" href="/assets/css/base/settings.css">
    <link rel="stylesheet" href="/assets/css/ext/fontawesome.min.css">

    <meta property="og:title" content="UMKL | Match Stats" />
    <meta property="og:site_name" content="umkl.co.uk" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umkl.co.uk/schedule/stats/" />
    <meta property="og:image" content="https://umkl.co.uk/assets/media/brand/cheep_cheep_banner_crop.avif" />
    <meta property="og:description" content="This page shows match stats in the UMKL" />
    <meta content="#bc0839" name="theme-color" />

    <!-- Include this to make the og:image larger -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Components -->
    <link rel="modulepreload" href="/assets/components/navbar.js">
    <link rel="modulepreload" href="/assets/components/footer.js">
    <script type="module" src="/assets/components/navbar.js" defer></script>
    <script type="module" src="/assets/components/footer.js" defer></script>

    <!-- Scripts -->
    <script src="/assets/scripts/base/theme.js"></script>

    <script type="module" src="/assets/scripts/base/settings.js" defer></script>
    <script defer src="/assets/scripts/base/imagefade.js" type="module"></script>
    <script type="module" src="/assets/scripts/components/matchstatsgenerate.js" defer></script>
</head>

<body id="top">
    <umkl-navbar></umkl-navbar>

    <main>
        <noscript>
            <blockquote class="rainbow"><b>Javascript disabled!</b><br>Please enable javascript, as it is used on this
                page<br></blockquote>
        </noscript>

        <h1>Match Stats</h1>
        <p class="p-below-title">View stats about past matches.</p>

        <div class="bubble-link-wrapper">
            <nav class="bubble-nav">
                <a class="bubble-nav-item no-color-link" href="/schedule/">Schedule</a>
                <a class="bubble-nav-item no-color-link active" href="/schedule/stats/">Match Stats</a>
            </nav>
        </div>

        <p class="stats-options-label">Options</p>
        <div class="stats-options">
            <label class="stats-option-row">
                <span class="stats-option-label">Include test matches</span>
                <span class="stats-toggle">
                    <input type="checkbox" id="testMatches">
                    <span class="stats-toggle-track"></span>
                </span>
            </label>
            <label class="stats-option-row">
                <span class="stats-option-label">Show the average points difference for a track</span>
                <span class="stats-toggle">
                    <input type="checkbox" id="pointsDiff">
                    <span class="stats-toggle-track"></span>
                </span>
            </label>
            <label class="stats-option-row">
                <span class="stats-option-label">Show how often teams have played a track</span>
                <span class="stats-toggle">
                    <input type="checkbox" id="teamFrequency">
                    <span class="stats-toggle-track"></span>
                </span>
            </label>
            <label class="stats-option-row">
                <span class="stats-option-label">Show the dates a track was played on</span>
                <span class="stats-toggle">
                    <input type="checkbox" id="daysPlayed">
                    <span class="stats-toggle-track"></span>
                </span>
            </label>
        </div>

        <div id="JSTeamBox" class="team-info"></div>
    </main>

    <umkl-footer></umkl-footer>
</body>

</html>
