<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Credits | UMKL</title>
    <meta name="description" content="Credits for the UMKL site">
    <link rel="icon" href="/assets/media/brand/favicon.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/base/style.css">
    <link rel="stylesheet" href="/assets/css/base/settings.css">
    <link rel="stylesheet" href="/assets/css/pages/credits.css">
    <link rel="stylesheet" href="/assets/css/components/audioplayer.css">

    <meta property="og:title" content="UMKL | Credits" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umkl.co.uk/credits/" />
    <meta property="og:image" content="https://umkl.co.uk/assets/media/brand/UMKL_banner.avif" />
    <meta property="og:description" content="Credits for the UMKL site" />
    <meta content="#bc0839" name="theme-color" />
    <meta content="https://umkl.co.uk/assets/media/brand/favicon.png" property="og:logo" />

    <!-- Include this to make the og:image larger -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Components -->
    <link rel="modulepreload" href="/assets/components/navbar.js">
    <link rel="modulepreload" href="/assets/components/footer.js">
    <script type="module" src="/assets/components/navbar.js" defer></script>
    <script type="module" src="/assets/components/footer.js" defer></script>

    <!-- Scripts -->
    <script src="/assets/scripts/base/theme.js"></script>
<script type="module" src="/assets/scripts/base/settings.js" defer></script>
<script defer src="/assets/scripts/base/imagefade.js" type="module"></script>
    <script type="module" src="/assets/scripts/pages/creditsgenerate.js" defer></script>
</head>

<body id="top">
    <umkl-navbar></umkl-navbar>

    <main>
        <div>
            <audio id="audio" src="/assets/media/bgm/loading_playlist.opus" preload="auto"></audio>
            <script type="text/javascript" src="/assets/scripts/components/audioplayer.js" id="audioPlayerScript" defer></script>
            <div id="audioStatus" data-playlist="bgm.txt" class="hidden">
                <span id="BGMName">Music</span><br>
                <div class="audioControls">
                    <span class="playContainer">
                        <img loading="lazy" src="" id="playIcon" />
                    </span>
                    <div id="audioProgressBar">
                        <div id="audioBufferBar"></div>
                    </div>
                    <span id="currentTime" class="time">0:00</span>
                    <span>/</span>
                    <span id="totalTime" class="time">0:00</span>
                </div>
                <p id="playlistText" class="hidden"></p>
            </div>
            <noscript><blockquote class="rainbow"><b>Javascript disabled!</b><br>Please enable javascript, as is it used on this page<br></blockquote></noscript>
        </div>

        <div class="header-wrapper">
            <h1>Credits</h1>
            <p class="p-below-title">People who worked on and contributed to the University Mario Kart League</p>
            <a href="/sitemap">View sitemap</a>
        </div>
        

        <div id="creditGenerate"></div>
    </main>

    <umkl-footer></umkl-footer>
</body>
</html>
