<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="#bc0839" name="theme-color" />
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Credits | UMKL</title>
    <meta name="description" content="Credits for the UMKL site">
    <link rel="icon" href="/_assets/media/brand/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/_assets/media/brand/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap">
    <link rel="stylesheet" href="/_assets/css/base/style.css">
    <link rel="stylesheet" href="/_assets/css/base/settings.css">
    <link rel="stylesheet" href="/_assets/css/pages/credits.css">
    <link rel="stylesheet" href="/_assets/css/components/audioplayer.css">

    <meta property="og:title" content="UMKL | Credits" />
    <meta property="og:site_name" content="umkl.co.uk" />
    <meta property="og:logo" content="https://umkl.co.uk/_assets/media/brand/guidelines/logo_transparent_standard.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umkl.co.uk/credits/" />
    <meta property="og:image" content="https://umkl.co.uk/_assets/media/brand/UMKL_banner.avif" />
    <meta property="og:description" content="Credits for the UMKL site" />

    <!-- Include this to make the og:image larger -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Components -->
    <link rel="modulepreload" href="/_assets/webcomponents/navbar.js">
    <link rel="modulepreload" href="/_assets/webcomponents/footer.js">
    <script type="module" src="/_assets/webcomponents/navbar.js" defer></script>
    <script type="module" src="/_assets/webcomponents/footer.js" defer></script>

    <!-- Scripts -->
    <script src="/_assets/scripts/base/theme.js"></script>
    <script type="module" src="/_assets/scripts/base/settings.js" defer></script>
    <script defer src="/_assets/scripts/base/imagefade.js" type="module"></script>
    <script type="module" src="/_assets/scripts/pages/creditsgenerate.js" defer></script>
</head>

<body id="top">
    <umkl-navbar></umkl-navbar>

    <main>
        <noscript>
            <blockquote class="rainbow"><b>Javascript disabled!</b><br>Please enable javascript, as it is used on this
                page<br></blockquote>
        </noscript>

        <audio id="audio" src="/_assets/media/bgm/credits/loading_playlist.opus" preload="auto"></audio>
        <div id="audioStatus" data-playlist="bgm.txt" class="hidden">
            <span id="BGMName">Music</span><br>
            <div class="audioControls">
                <span class="playContainer">
                    <img loading="lazy" src="" id="playIcon" />
                </span>
                <div id="audioProgressBar">
                    <div id="audioBufferBar"></div>
                </div>
                <span id="currentTime" class="time">0:00</span>
                <span>/</span>
                <span id="totalTime" class="time">0:00</span>
            </div>
            <p id="playlistText" class="hidden"></p>
        </div>
        <script type="module" src="/_assets/scripts/components/audioplayer.js" id="audioPlayerScript"></script>

        <h1>Credits</h1>
        <p class="p-below-title">People who worked on and contributed to the UMKL</p>

        <div id="creditGenerate"></div>

        <div class="credits-footnotes">
            <p>
                <a href="/rules/privacy">View the privacy policy and terms of service for Cheep
                    Cheep and the UMKL website</a>, you can also <a href="/changelog">view changelogs here</a>.
            </p>
            <p>
                All the source code for the website can be found at our
                <a href="https://github.com/universitymariokartleague/UMKLsite">GitHub repository</a>.
            </p>
        </div>
    </main>

    <umkl-footer></umkl-footer>
</body>

</html>
