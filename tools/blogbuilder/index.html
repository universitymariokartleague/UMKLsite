<!DOCTYPE html>
<html lang="en">

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Article Builder | UMKL</title>
    <meta name="description" content="Build a blog here for the UMKL site!">
    <link rel="icon" href="https://umkl.co.uk/assets/media/brand/favicon.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/base/style.css">
    <link rel="stylesheet" href="/assets/css/base/settings.css">
    <link rel="stylesheet" href="/assets/css/pages/blogbuilder.css">

    <meta property="og:title" content="Blog Builder | University Mario Kart League" />
    <meta property="og:site_name" content="UMKL" />
    <meta property="og:url" content="https://umkl.co.uk/tools/blogbuilder" />
    <meta property="og:image" content="https://umkl.co.uk/assets/media/brand/UMKL_banner.avif" />
    <meta property="og:description" content="Build a blog here for the UMKL site!" />
    <meta content="#bc0839" name="theme-color" />

    <!-- Include this to make the og:image larger -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Scripts -->
    <script src="/assets/scripts/base/theme.js"></script>

    <script type="module" src="/assets/scripts/pages/blogbuilder.js" defer></script>
    <script type="module" src="/assets/scripts/base/settings.js" defer></script>
    <script defer src="/assets/scripts/base/imagefade.js" type="module"></script>
</head>

<body>

    <div class="builder-top-bar">
        <header class="builder-bar">
            <img loading="lazy" class="builder-bar-logo" alt="UMKL logo" src="/assets/media/brand/guidelines/logo_transparent_white.avif" style="width: 32px;"/>
            <span class="builder-title">Article Builder - UMKL</span>
            <button id="exitBtn" class="btn-exit">← Exit</button>
        </header>

        <div class="toolbar">
            <div class="toolbar-group">
                <select id="blockTypeSelect">
                    <option value="h3">Heading</option>
                    <option value="p" selected>Paragraph</option>
                </select>
                <button id="boldBtn" class="btn-tool"><b>B</b></button>
                <button id="linkBtn" class="btn-tool">Link</button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <button id="insertImageBtn" class="btn-tool">Image
                </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <button id="clearBtn" class="btn-tool">Clear All
                </button>
                <button id="saveBtn" class="btn-tool">Save
                </button>
            </div>
        </div>
    </div>

    <main class="editor-container">
        <div class="article-layout">

            <div class="article-main-content">
                <h1 id="articleTitle" class="editable-title" contenteditable="true" data-placeholder="Click to edit title">Click to edit title</h1>

                <div id="articleSubtitle" class="editable-subtitle" contenteditable="true"
                    data-placeholder="Click to edit subtitle">
                        Click to edit subtitle
                </div>

                <div id="mainImageContainer" class="main-image-placeholder">
                    <span id="mainPlus" class="plus-icon">+</span>
                    <span id="mainLabel">Click to add image</span>
                    <img id="mainImagePreview" class="main-image-preview hidden" src="" alt="Main Preview">
                </div>
                <input type="file" id="mainFileInput" accept="image/*" class="hidden">
                <div id="mainCaption" class="editable-caption" contenteditable="true">Click to edit caption</div>

                <div id="bodyEditor" class="body-editor" contenteditable="true">
                    <h3>Start the body with a heading</h3>
                    <p>Start writing the body of the article</p>
                </div>
            </div>

            <aside class="article-sidebar">
                <div class="meta-group">
                    <label class="meta-label">Date</label>
                    <div id="metaDate" class="meta-value-date"></div>
                </div>
                <div class="meta-group">
                    <label for="metaAuthor" class="meta-label">Author</label>
                    <input type="text" id="metaAuthor" class="meta-input" placeholder="Click to add author">
                </div>
                <div class="meta-group">
                    <label for="metaTags" class="meta-label">Tags</label>
                    <input type="text" id="metaTags" class="meta-input"
                        placeholder="Click to add tags (comma separated)">
                </div>
            </aside>

        </div>
    </main>

    <input type="file" id="bodyFileInput" accept="image/*" class="hidden">
</body>

</html>
