<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Colour Picker | UMKL</title>
    <meta name="description" content="Pick a colour on the UMKL site">
    <link rel="icon" href="/assets/media/brand/favicon.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/base/style.css">
    <link rel="stylesheet" href="/assets/css/base/settings.css">
    <link rel="stylesheet" href="/assets/css/components/colorpicker.css">
    <link rel="stylesheet" href="/assets/css/components/discordrolepreview.css">
    <link rel="stylesheet" href="/assets/css/ext/fontawesome.min.css">
    <link rel="stylesheet" href="/assets/css/ext/coloris.min.css">

    <meta property="og:title" content="UMKL | Track Randomiser" />
    <meta property="og:site_name" content="UMKL" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umkl.co.uk/tools/trackrandomiser/" />
    <meta property="og:image" content="https://umkl.co.uk/assets/media/brand/UMKL_banner.avif" />
    <meta property="og:description" content="Pick a colour on the UMKL site" />
    <meta content="#bc0839" name="theme-color" />
    <meta content="https://umkl.co.uk/assets/media/brand/favicon.png" property="og:logo" />

    <!-- Include this to make the og:image larger -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Components -->
    <link rel="modulepreload" href="/assets/components/navbar.js">
    <link rel="modulepreload" href="/assets/components/footer.js">
    <script type="module" src="/assets/components/navbar.js" defer></script>
    <script type="module" src="/assets/components/footer.js" defer></script>

    <!-- Scripts -->
    <script src="/assets/scripts/base/theme.js"></script>

    <script type="module" src="/assets/scripts/base/settings.js" defer></script>
    <script defer src="/assets/scripts/base/imagefade.js" type="module"></script>
    <script type="module" src="/assets/scripts/ext/coloris.js" defer></script>
</head>

<body id="top">
    <umkl-navbar></umkl-navbar>

    <main>
        <a href="/tools/">Back</a>
        <h1>Colour Picker</h1>
        <p class="p-below-title">Pick and visualise colours here</p>
        <hr class="hr-below-title">

        <div class="discordRolePreview">
            <iframe id="discordRoleiFrame" src="/rules/faq/discordrole.html" frameborder="0"></iframe>
        </div>

        <p class="color-picker square">
            <input value="#1baa8b" id="color-picker" class="coloris" type="text" data-coloris>
            <span id="colorMessage">Current colour: <code translate="no">#1baa8b</code></span>
        </p>
    </main>

    <umkl-footer></umkl-footer>
</body>

</html>
