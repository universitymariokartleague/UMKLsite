<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="#bc0839" name="theme-color" />
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Colour Picker | UMKL</title>
    <meta name="description" content="Pick a colour on the UMKL site">
    <link rel="icon" href="/_assets/media/brand/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/_assets/media/brand/favicon.png">
    <link rel="stylesheet" href="/_assets/css/base/style.css">
    <link rel="stylesheet" href="/_assets/css/base/settings.css">
    <link rel="stylesheet" href="/_assets/css/components/colorpicker.css">
    <link rel="stylesheet" href="/_assets/css/components/discordrolepreview.css">
    <link rel="stylesheet" href="/_assets/css/ext/fontawesome.min.css">

    <meta property="og:title" content="UMKL | Colour Picker" />
    <meta property="og:site_name" content="umkl.co.uk" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umkl.co.uk/tools/colourpicker/" />
    <meta property="og:image" content="https://umkl.co.uk/_assets/media/brand/UMKL_banner.avif" />
    <meta property="og:description" content="Pick a colour on the UMKL site" />

    <!-- Include this to make the og:image larger -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Components -->
    <link rel="modulepreload" href="/_assets/webcomponents/navbar.js">
    <link rel="modulepreload" href="/_assets/webcomponents/footer.js">
    <script type="module" src="/_assets/webcomponents/navbar.js" defer></script>
    <script type="module" src="/_assets/webcomponents/footer.js" defer></script>

    <!-- Scripts -->
    <script src="/_assets/scripts/base/theme.js"></script>

    <script type="module" src="/_assets/scripts/base/settings.js" defer></script>
    <script defer src="/_assets/scripts/base/imagefade.js" type="module"></script>
    <script type="module" src="/_assets/scripts/components/colorpicker.js" defer></script>
</head>

<body id="top">
    <umkl-navbar></umkl-navbar>

    <main>
        <a href="/tools/">Back</a>
        <h1>Colour Picker</h1>
        <p class="p-below-title">Pick and visualise colours here</p>

        <div class="discordRolePreview">
            <iframe id="discordRoleiFrame" src="/rules/faq/discordrole.html" frameborder="0"></iframe>
        </div>

        <p class="color-picker square">
            <span class="color-picker-field" id="colorPickerField">
                <button type="button" class="color-picker-swatch" id="colorPickerSwatch" aria-label="Open colour picker" aria-expanded="false" style="background-color: #1baa8b;"></button>
                <input value="#1baa8b" id="color-picker" class="color-picker-input" type="text" autocomplete="off" spellcheck="false" maxlength="7" aria-label="Colour value">
            </span>
            <span id="colorMessage">Current colour: <code translate="no">#1baa8b</code></span>
        </p>
    </main>

    <umkl-footer></umkl-footer>
</body>

</html>
