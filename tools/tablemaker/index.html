<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="#bc0839" name="theme-color" />
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-title" content="UMKL">
    <title>Table Maker | UMKL</title>
    <meta name="description" content="Make a UMKL styled results table for a 6v6, 4v4v4 or 3v3v3v3 match">
    <link rel="icon" href="/_assets/media/brand/favicon.jpg" type="image/png">
    <link rel="apple-touch-icon" href="/_assets/media/brand/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap">
    <link rel="stylesheet" href="/_assets/css/base/style.css">
    <link rel="stylesheet" href="/_assets/css/components/colorpicker.css">
    <link rel="stylesheet" href="/_assets/css/components/toggle.css">
    <link rel="stylesheet" href="/_assets/css/components/modal.css">
    <link rel="stylesheet" href="/_assets/css/pages/tablemaker.css">
    <link rel="stylesheet" href="/_assets/css/base/settings.css">
    <link rel="stylesheet" href="/_assets/css/components/copypopup.css">
    <link rel="stylesheet" href="/_assets/css/ext/fontawesome.min.css">

    <meta property="og:title" content="UMKL | Table Maker" />
    <meta property="og:site_name" content="umkl.co.uk" />
    <meta property="og:logo"
        content="https://umkl.co.uk/_assets/media/brand/guidelines/logo_transparent_standard.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umkl.co.uk/tools/tablemaker/" />
    <meta property="og:image" content="https://umkl.co.uk/_assets/media/brand/UMKL_banner.avif" />
    <meta property="og:description" content="Make a UMKL styled results table for a 6v6, 4v4v4 or 3v3v3v3 match" />

    <!-- Include this to make the og:image larger -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Components -->
    <link rel="modulepreload" href="/_assets/webcomponents/navbar.js">
    <link rel="modulepreload" href="/_assets/webcomponents/footer.js">
    <script type="module" src="/_assets/webcomponents/navbar.js" defer></script>
    <script type="module" src="/_assets/webcomponents/footer.js" defer></script>

    <!-- Scripts -->
    <script src="/_assets/scripts/base/theme.js"></script>

    <script type="module" src="/_assets/scripts/base/settings.js" defer></script>
    <script type="module" src="/_assets/scripts/base/smartback.js" defer></script>
    <script type="module" src="/_assets/scripts/pages/tablemaker.js" defer></script>
</head>

<body id="top">
    <umkl-navbar></umkl-navbar>

    <main class="reading-page">
        <div class="bubble-link-wrapper">
            <a href="/tools/" class="bubble-link no-color-link" data-smart-back>
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="none" viewBox="0 0 24 24"
                    role="presentation">
                    <path fill="currentColor"
                        d="M22 13H4.94l5.18 5.29-1.38 1.42-6.17-6.3a2 2 0 0 1 0-2.82l6.17-6.3 1.38 1.42L4.94 11H22z">
                    </path>
                </svg>
                Back</a>
        </div>
        <h1>Table Maker</h1>
        <p class="p-below-title">Make a results table for a 6v6, 4v4v4 or 3v3v3v3 match</p>

        <datalist id="team-list"></datalist>
        <p id="event-status"></p>

        <div class="bubble-link-wrapper table-maker-modes">
            <nav class="bubble-nav" id="mode-select">
                <button type="button" class="bubble-nav-item" data-teams="2">6v6</button>
                <button type="button" class="bubble-nav-item" data-teams="3">4v4v4</button>
                <button type="button" class="bubble-nav-item" data-teams="4">3v3v3v3</button>
            </nav>
            <button type="button" id="importButton" class="bubble-link"><svg xmlns="http://www.w3.org/2000/svg"
                    width="1em" height="1em" fill="none" viewBox="0 0 24 24" role="presentation">
                    <path fill="currentColor"
                        d="M4 5h3l2-2h6l2 2h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2m8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10m0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6">
                    </path>
                </svg> Import screenshot (OCR)</button>
            <button id="clearButton" class="bubble-link"><svg xmlns="http://www.w3.org/2000/svg" width="1em"
                    height="1em" fill="none" viewBox="0 0 24 24" role="presentation">
                    <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"
                        d="M8.586 2.586A2 2 0 0 1 10 2h4a2 2 0 0 1 2 2v2h3a1 1 0 1 1 0 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8a1 1 0 0 1 0-2h3V4a2 2 0 0 1 .586-1.414ZM10 6h4V4h-4v2Zm1 4a1 1 0 1 0-2 0v8a1 1 0 1 0 2 0v-8Zm4 0a1 1 0 1 0-2 0v8a1 1 0 1 0 2 0v-8Z">
                    </path>
                </svg> Clear</button>
            <input type="file" id="importInput" accept="image/*" hidden>
        </div>

        <div class="table-maker-inputs" id="team-inputs"></div>

        <div class="stats-options">
            <label class="stats-option-row">
                <span class="stats-option-label">Test match</span>
                <span class="stats-toggle">
                    <input type="checkbox" id="test-match">
                    <span class="stats-toggle-track"></span>
                </span>
            </label>
        </div>

        <div class="table-maker-actions">
            <button id="shareButton" class="bubble-link"><span class="fa-solid fa-share"></span> Share Table</button>
            <button id="downloadButton" class="bubble-link"><svg xmlns="http://www.w3.org/2000/svg" width="1em"
                    height="1em" fill="none" viewBox="0 0 24 24" role="presentation">
                    <path fill="currentColor"
                        d="M13 3v10.17l3.59-3.58L18 11l-6 6-6-6 1.41-1.41L11 13.17V3zM4 19h16v2H4z">
                    </path>
                </svg> Download</button>
        </div>

        <canvas id="table-canvas" class="table-maker-preview" width="3268" height="2430"></canvas>
    </main>

    <umkl-footer></umkl-footer>

    <div id="importModal" class="modal-overlay hidden">
        <div id="importModalCard" class="modal-card" role="dialog" aria-modal="true" aria-labelledby="importModalTitle">
            <h3 id="importModalTitle"></h3>
            <span id="importModalSubtitle" class="modal-subtitle"></span>
            <ul id="importModalList" class="import-modal-list"></ul>
            <div class="modal-actions modal-actions-row">
                <button type="button" id="importModalClose" class="btn-modal-option btn-modal-primary">OK</button>
            </div>
        </div>
    </div>
</body>

</html>
