    <meta
        content="The University Mario Kart League (UMKL) brings together students from universities around the UK to compete as teams of six in Mario Kart 8 Deluxe!"

</head>

<body id="top">
    <umkl-navbar></umkl-navbar>

    <main>


        <div class="section">
            <div class="bubble-link-wrapper">
                <a href="/news/" class="bubble-link no-color-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="none" viewBox="0 0 24 24"
                        role="presentation" class="IconVector-module_sm__Q8ZiC">
                        <title>News</title>
                        <path fill="currentColor"
                            d="M21 17a4 4 0 0 1-3.794 3.995L17 21H3V3h18zM5 19h12a2 2 0 0 0 2-2V5H5zm8-2H7v-2h6zm4-4H7v-2h10zm0-4H7V7h10z">
                        </path>
                    </svg>
                    News</a>
                <a href="/videos/" class="bubble-link no-color-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="none" viewBox="0 0 24 24"
                        role="presentation" class="IconVector-module_sm__Q8ZiC">
                        <title>Play Outline</title>
                        <path fill="currentColor"
                            d="m20.86 10 .02-.01a2 2 0 0 1 1.181 1.825l-.004.147a2 2 0 0 1-1.177 1.678L4 22V2zM6 18.777l13.992-6.93.034-.016.014-.007L6 5.162z">
                        </path>
                    </svg>
                    Videos</a>
                <a href="/what-is-umkl/" class="bubble-link no-color-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="none" viewBox="0 0 24 24"
                        role="presentation" class="IconVector-module_sm__Q8ZiC">
                        <title>Question</title>
                        <path fill="currentColor"
                            d="M13.017 14.92V18h-2.7v-3.08zM12.312 7q2.142 0 3.234.821 1.093.822 1.093 2.523 0 1.774-1.093 2.61-1.092.837-3.234.837h-1.995v-2.288h2.274q.719 0 1.004-.25.286-.249.286-.865t-.315-.858-1.122-.242h-3.52V7z">
                        </path>
                        <path fill="currentColor" fill-rule="evenodd"
                            d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2m0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16"
                            clip-rule="evenodd"></path>
                    </svg>
                    New to UMKL?</a>
            </div>

            <div class="news-grid-container">
            </div>
        </div>


        <div class="section carousel-section">
            <div class="carousel-header">
                <h2>Match Replays</h2>
                <div class="bubble-link-wrapper">
                    <a href="/videos/" class="bubble-link no-color-link">View All</a>
                    <a id="carouselPrev" class="bubble-link no-color-link" aria-label="Previous videos">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="none" viewBox="0 0 24 24"
                            role="img" class="IconVector-module_xl__AtyCA">
                            <title>Previous</title>
                            <path fill="currentColor" d="m14 18-6-6 6-6 1.4 1.4-4.6 4.6 4.6 4.6z"></path>
                        </svg>
                    </a>
                    <a id="carouselNext" class="bubble-link no-color-link" aria-label="Next videos">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="none" viewBox="0 0 24 24"
                            role="img" class="IconVector-module_xl__AtyCA">
                            <title>Next</title>
                            <path fill="currentColor" d="m13.2 12.123-4.6-4.6 1.4-1.4 6 6-6 6-1.4-1.4z"></path>
                        </svg>
                    </a>
                </div>
            </div>

            <div class="carousel-container" id="videoCarousel"></div>
        </div>

        <div class="section">
            <hr>
            <h1>2025/26 Season</h1>
            <div class="standings-container">
                <div id="HomeSeasonTop3" class="podium-grid"></div>

                <div class="standings-card-wrapper">
                    <div id="HomeTeamTableLoading"></div>
                    <div id="HomeJSTeamTable"></div>

                    <div class="toggle-wrapper">
                        <a href="#" id="toggleShowAll" class="show-all-btn no-color-link">Show all &#9660;</a>
                    </div>
                </div>

                <div class="full-standings-wrapper">
                    <a href="/standings/" class="bubble-link no-color-link">View full standings</a>
                </div>
            </div>
        </div>

        <!-- <div id="upcomingMatchesError"></div>
        <div id="upcomingMatchesBox"></div> -->

    </main>

    <umkl-footer></umkl-footer>
