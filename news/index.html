<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="#bc0839" name="theme-color" />
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>News | UMKL</title>
    <meta name="description" content="See all the news concerning the UMKL">
    <link rel="icon" href="/_assets/media/brand/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/_assets/media/brand/favicon.png">
    <link rel="stylesheet" href="/_assets/css/base/style.css">
    <link rel="stylesheet" href="/_assets/css/components/news.css">
    <link rel="stylesheet" href="/_assets/css/base/settings.css">
    <link rel="stylesheet" href="/_assets/css/ext/fontawesome.min.css">

    <meta property="og:title" content="UMKL | News" />
    <meta property="og:site_name" content="umkl.co.uk" />
    <meta property="og:url" content="https://umkl.co.uk/news/" />
    <meta property="og:image" content="https://umkl.co.uk/_assets/media/brand/UMKL_banner.avif" />
    <meta property="og:description" content="See all the news concerning the UMKL" />

    <!-- Include this to make the og:image larger -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Components -->
    <link rel="modulepreload" href="/_assets/webcomponents/navbar.js">
    <link rel="modulepreload" href="/_assets/webcomponents/footer.js">
    <script defer="" src="/_assets/webcomponents/navbar.js" type="module"></script>
    <script defer="" src="/_assets/webcomponents/footer.js" type="module"></script>

    <!-- Scripts -->
    <script src="/_assets/scripts/base/theme.js"></script>
    <script defer="" src="/_assets/scripts/base/settings.js" type="module"></script>
    <script defer src="/_assets/scripts/base/imagefade.js" type="module"></script>
    <script defer="" src="/_assets/scripts/components/newsgenerate.js" type="module"></script>
</head>

<body id="top">
    <umkl-navbar></umkl-navbar>

    <main>
        <h1>News</h1>

        <div class="bubble-link-wrapper">
            <a class="bubble-link no-color-link" href="/news/feed.xml" target="_blank"><svg viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    width="14" height="14" style="vertical-align:middle;margin-right:3px" aria-hidden="true">
                    <path d="M4 11a9 9 0 0 1 9 9"></path>
                    <path d="M4 4a16 16 0 0 1 16 16"></path>
                    <circle cx="5" cy="19" r="1" fill="currentColor"></circle>
                </svg>
                RSS Feed
            </a>
        </div>

        <div id="news-search-wrapper">
            <input id="news-search" placeholder="Search news..." type="text" />
        </div>

        <div class="news-grid" id="news-container"></div>
    </main>

    <umkl-footer></umkl-footer>
</body>

</html>
