<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Loading... | UMKL</title>
    <meta name="description" content="This page contains information about a specific team in the UMKL">
    <link rel="icon" href="/assets/media/brand/favicon.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/base/style.css">
    <link rel="stylesheet" href="/assets/css/components/teampage.css">
    <link rel="stylesheet" href="/assets/css/base/settings.css">
    <link rel="stylesheet" href="/assets/css/components/teamstandings.css">
    <link rel="stylesheet" href="/assets/css/components/results.css">
    <link rel="stylesheet" href="/assets/css/ext/fontawesome.min.css">

    <meta property="og:title" content="UMKL | Teams" />
    <meta property="og:site_name" content="umkl.co.uk" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umkl.co.uk/teams/" />
    <meta property="og:image" content="https://umkl.co.uk/assets/media/brand/cheep_cheep_banner_crop.avif" />
    <meta property="og:description" content="This page contains information about a specific team in the UMKL" />
    <meta content="#bc0839" name="theme-color" />

    <!-- Include this to make the og:image larger -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- Components -->
    <link rel="modulepreload" href="/assets/components/navbar.js">
    <link rel="modulepreload" href="/assets/components/footer.js">
    <script type="module" src="/assets/components/navbar.js" defer></script>
    <script type="module" src="/assets/components/footer.js" defer></script>

    <!-- Scripts -->
    <script src="/assets/scripts/base/theme.js"></script>

    <script type="module" src="/assets/scripts/base/settings.js" defer></script>
    <script defer src="/assets/scripts/base/imagefade.js" type="module"></script>
    <script type="module" src="/assets/scripts/components/teaminfogenerate.js" defer></script>
    <script type="module" src="/assets/scripts/components/matchhistorygenerate.js" defer></script>
    <script defer src="/assets/scripts/components/videocarousel.js" type="module"></script>

    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js" defer></script>
</head>

<body id="top">
    <umkl-navbar></umkl-navbar>

    <main>
        <div class="bubble-link-wrapper">
            <a href="/teams/" class="bubble-link no-color-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="none" viewBox="0 0 24 24"
                    role="presentation">
                    <path fill="currentColor"
                        d="M22 13H4.94l5.18 5.29-1.38 1.42-6.17-6.3a2 2 0 0 1 0-2.82l6.17-6.3 1.38 1.42L4.94 11H22z">
                    </path>
                </svg>
                All teams</a>
        </div>

        <div id="teamHero" class="team-hero">
            <div id="heroPattern"></div>
            <div class="hero-content">
                <div class="hero-logo-wrapper">
                    <img loading="lazy" id="teamHeroLogo" class="hero-logo" src="" alt="Team Emblem" />
                </div>
                <h1 translate="no" id="teamNameBox" class="hero-team-name"></h1>
            </div>
        </div>

        <div class="stats-section section">
            <h2>Statistics</h2>
            <div class="stats-grid">
                <!-- Season Stats -->
                <div class="stats-left">
                    <div class="stats-header-row">
                        <h3>Season 2</h3>
                    </div>
                    <div id="seasonStatsGrid" class="season-stats-grid"></div>
                </div>

                <!-- Team Summary -->
                <div class="stats-right">
                    <div class="team-summary-card">
                        <h3>Team Summary</h3>
                        <div id="teamSummaryList" class="summary-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <!--<iframe id="teamMapIFrame" title="A map of the UK showing the location of all the UMKL teams"
            src="/teams/details/map/index.html?team=York" frameborder="0"></iframe>-->

        <div class="match-history-section section">
            <h2>Past Matches</h2>
            <div id="JSMatchHistory"></div>
        </div>



        <!-- I will make this only contain videos relevant to the current team's page -->
        <div class="carousel-section section">
            <div class="carousel-header">
                <h2>Related Videos</h2>
                <div class="bubble-link-wrapper">
                    <a href="/videos/" class="bubble-link no-color-link">View All</a>
                    <a id="carouselPrev" class="bubble-link no-color-link" aria-label="Previous videos">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="none" viewBox="0 0 24 24"
                            role="img" class="IconVector-module_xl__AtyCA">
                            <title>Previous</title>
                            <path fill="currentColor" d="m14 18-6-6 6-6 1.4 1.4-4.6 4.6 4.6 4.6z"></path>
                        </svg>
                    </a>
                    <a id="carouselNext" class="bubble-link no-color-link" aria-label="Next videos">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="none" viewBox="0 0 24 24"
                            role="img" class="IconVector-module_xl__AtyCA">
                            <title>Next</title>
                            <path fill="currentColor" d="m13.2 12.123-4.6-4.6 1.4-1.4 6 6-6 6-1.4-1.4z"></path>
                        </svg>
                    </a>
                </div>
            </div>

            <div class="carousel-container" id="videoCarousel"></div>
        </div>
    </main>

    <umkl-footer></umkl-footer>
</body>

</html>
