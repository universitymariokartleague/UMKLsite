<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Videos | UMKL</title>
    <meta name="description" content="Watch all match replays and videos from the UMKL">
    <link rel="icon" href="https://umkl.co.uk/assets/media/brand/favicon.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/base/style.css">
    <link rel="stylesheet" href="/assets/css/components/home.css">
    <link rel="stylesheet" href="/assets/css/pages/videos.css">
    <link rel="stylesheet" href="/assets/css/base/settings.css">
    <link rel="stylesheet" href="/assets/css/ext/fontawesome.min.css">

    <meta property="og:title" content="UMKL - Videos" />
    <meta property="og:site_name" content="umkl.co.uk" />
    <meta property="og:url" content="https://umkl.co.uk/videos/" />
    <meta property="og:image" content="https://umkl.co.uk/assets/media/brand/promo/oganimated.avif" />
    <meta content="#bc0839" name="theme-color" />

    <link rel="modulepreload" href="/assets/components/navbar.js" />
    <link rel="modulepreload" href="/assets/components/footer.js" />
    <script defer src="/assets/components/navbar.js" type="module"></script>
    <script defer src="/assets/components/footer.js" type="module"></script>

    <script src="/assets/scripts/base/theme.js"></script>
    <script defer src="/assets/scripts/base/settings.js" type="module"></script>
    <script defer src="/assets/scripts/base/imagefade.js" type="module"></script>
    <script type="module" src="/assets/scripts/base/smartback.js" defer></script>
    <script defer src="/assets/scripts/pages/loadvideosgrid.js" type="module"></script>
</head>

<body id="top">
    <umkl-navbar></umkl-navbar>

    <main>
        <div class="section">
            <div class="bubble-link-wrapper">
                <a href="/" class="bubble-link no-color-link" data-smart-back>
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="none" viewBox="0 0 24 24"
                        role="presentation">
                        <path fill="currentColor"
                            d="M22 13H4.94l5.18 5.29-1.38 1.42-6.17-6.3a2 2 0 0 1 0-2.82l6.17-6.3 1.38 1.42L4.94 11H22z">
                        </path>
                    </svg>
                    Home</a>
            </div>

            <div class="videos-header">
                <h1>Videos</h1>
                <p class="p-below-title">View all replays of our previous matches</p>
            </div>

            <div class="videos-search-row">
                <div id="videos-search-wrapper">
                    <input id="videos-search" placeholder="Search videos..." type="text" />
                </div>

                <label class="videos-toggle">
                    <input type="checkbox" id="videos-test-match-toggle" checked />
                    <span class="videos-toggle-track"></span>
                    Show test matches
                </label>
            </div>

            <div id="videos-tags"></div>

            <div class="videos-grid" id="videosGridContainer"></div>
            <div id="videos-no-results" style="display:none;">
                <p>No videos found</p>
                <button id="videos-clear-search" type="button">Clear search</button>
            </div>
        </div>
    </main>

    <umkl-footer></umkl-footer>
</body>

</html>
