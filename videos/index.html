<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="#bc0839" name="theme-color" />
    <meta name="color-scheme" content="dark light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-title" content="UMKL">
    <title>Videos | UMKL</title>
    <meta name="description" content="Watch all match replays and videos from the UMKL">
    <link rel="icon" href="https://umkl.co.uk/_assets/media/brand/favicon.jpg" type="image/png">
    <link rel="apple-touch-icon" href="https://umkl.co.uk/_assets/media/brand/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap">
    <link rel="stylesheet" href="/_assets/css/base/style.css">
    <link rel="stylesheet" href="/_assets/css/components/videocarousel.css">
    <link rel="stylesheet" href="/_assets/css/components/toggle.css">
    <link rel="stylesheet" href="/_assets/css/components/searchbox.css">
    <link rel="stylesheet" href="/_assets/css/pages/videos.css">
    <link rel="stylesheet" href="/_assets/css/base/settings.css">
    <link rel="stylesheet" href="/_assets/css/ext/fontawesome.min.css">

    <meta property="og:title" content="UMKL - Videos" />
    <meta property="og:site_name" content="umkl.co.uk" />
    <meta property="og:logo"
        content="https://umkl.co.uk/_assets/media/brand/guidelines/logo_transparent_standard.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umkl.co.uk/videos/" />
    <meta property="og:image" content="https://umkl.co.uk/_assets/media/brand/promo/oganimated.avif" />

    <link rel="modulepreload" href="/_assets/webcomponents/navbar.js" />
    <link rel="modulepreload" href="/_assets/webcomponents/footer.js" />
    <script defer src="/_assets/webcomponents/navbar.js" type="module"></script>
    <script defer src="/_assets/webcomponents/footer.js" type="module"></script>

    <script src="/_assets/scripts/base/theme.js"></script>
    <script defer src="/_assets/scripts/base/settings.js" type="module"></script>
    <script defer src="/_assets/scripts/base/imagefade.js" type="module"></script>
    <script defer src="/_assets/scripts/pages/loadvideosgrid.js" type="module"></script>
</head>

<body id="top">
    <umkl-navbar></umkl-navbar>

    <main>
        <div class="section">
            <div class="videos-header">
                <h1>Videos</h1>
                <p class="p-below-title">View livestream replays of previous matches.</p>
            </div>

            <div class="videos-search-row">
                <div id="videos-search-wrapper">
                    <input id="videos-search" placeholder="Search videos..." type="text" />
                    <button type="button" id="videos-search-clear" class="search-clear-inline"
                        aria-label="Clear search">&times;</button>
                </div>

                <label class="videos-toggle">
                    <input type="checkbox" id="videos-test-match-toggle" checked />
                    <span class="videos-toggle-track"></span>
                    Show test matches
                </label>
            </div>

            <div id="videos-tags"></div>

            <div class="videos-grid" id="videosGridContainer"></div>
            <div id="videos-no-results" style="display:none;">
                <p>No videos found</p>
                <button id="videos-clear-search" type="button">Clear search</button>
            </div>
        </div>
    </main>

    <umkl-footer></umkl-footer>
</body>

</html>
